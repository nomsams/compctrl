name: Build Windows companion

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:geometry
      - run: npm run pack:windows
      - name: Verify generated checksums
        shell: pwsh
        run: |
          Get-ChildItem release/CompCtrl-*.exe | ForEach-Object {
            ./Verify-CompCtrl.ps1 -FilePath $_.FullName -ChecksumFile release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CompCtrl-Windows
          path: |
            release/*.exe
            release/*.sha256
            release/SHA256SUMS.txt
            Verify-CompCtrl.ps1
          if-no-files-found: error
